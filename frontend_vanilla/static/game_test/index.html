<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Game_test</title>
  </head>
  <body>
    <h4>This is a testing site</h4>
    <div id="context-div" style="padding: 5px;">
      <div>Game phase: <span id="game-phase"></span></div>
      <div>Time: <span id="game-time"></span></div>
      <div>Players: <span id="game-players"></span></div>
      <div>Context json: <span id="game-context"></span></div>
    </div>
    <div style="padding: 5px;">
      <h3>Input fields</h3>
      <div style="margin: 5px;">Username: <input type="text" id="input-name" /></div>
      <button style="margin: 5px;" id="connect-button">Connect</button>
      <button style="margin: 5px;" id="disconnect-button">Disconnect</button>
    </div>
    <div style="padding: 5px;">
      <div style="margin: 5px;">Seat: <input type="number" id="input-seat-number" min="1" max="6" /></div>
      <button style="margin: 5px;" id="move-button">Move seat</button>
    </div>
    <div id="controlls-div" style="padding: 5px;">
      <button style="margin: 5px;" id="hit-button">Hit</button>
      <button style="margin: 5px;" id="double-down-button">Double Down</button>
      <button style="margin: 5px;" id="split-button">Split</button>
      <button style="margin: 5px;" id="hold-button">Hold</button>
    </div>
  </body>
</html>
<script type="module" src="script.js"></script>
